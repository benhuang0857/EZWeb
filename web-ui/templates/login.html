{% extends "base.html" %}
{% block nav %}{% endblock %}
{% block title %}登入 — EZWeb{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <h1 class="login-title">EZWeb</h1>
    <p class="login-sub">WordPress 站台管理</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label>帳號</label>
        <input type="text" name="username" class="input" autofocus required>
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" name="password" class="input" required>
      </div>
      <button type="submit" class="btn btn-primary btn-full">登入</button>
    </form>
  </div>
</div>
{% endblock %}
