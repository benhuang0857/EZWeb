<div class="log-header">
  <strong>{{ site.display_name }}</strong> — 最近操作記錄
  <button onclick="document.getElementById('log-panel').innerHTML=''" class="btn btn-xs btn-outline">關閉</button>
</div>
{% if logs %}
  {% for log in logs %}
  <div class="log-entry log-{{ log.result }}">
    <div class="log-meta">
      <span class="log-op">{{ log.operation }}</span>
      <span class="log-result {{ log.result }}">{{ log.result }}</span>
      <span class="log-time">{{ log.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</span>
    </div>
    {% if log.stderr %}
    <pre class="log-output">{{ log.stderr[-1000:] }}</pre>
    {% endif %}
  </div>
  {% endfor %}
{% else %}
  <p class="text-muted">尚無記錄</p>
{% endif %}
